    --surface-2:#1B1F26;
    --border:#262B33;
    --text:#F2F3F5;
    --text-dim:#8A93A3;
    --text-faint:#565D6B;
    --accent:#45D6A8;
    --accent-dim:#1E4A3E;
    --danger:#E5636B;
    --danger-dim:#3A1F22;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); height:100%;
    overscroll-behavior-y:none;
  }
  body{
    display:flex; flex-direction:column;
    min-height:100dvh;
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    padding-left:var(--safe-l); padding-right:var(--safe-r);
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 12px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .topbar .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:600; margin:0 0 2px;
  }
  .topbar h1{ font-size:19px; margin:0; font-weight:700; letter-spacing:-.01em; }
  .iconbtn{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:20px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{ background:var(--surface-2); }
  main{ flex:1; overflow-y:auto; padding:14px 16px 24px; }

  /* Notice banner */
  .notice{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:12.5px;
    color:var(--text-dim); line-height:1.45;
  }
  .notice b{ color:var(--text); }
  .notice button{
    margin-left:auto; background:none; border:none; color:var(--text-faint);
    font-size:18px; padding:0 2px; flex-shrink:0;
  }

  /* List */
  .empty{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty .glyph{ font-size:34px; margin-bottom:10px; }
  .empty p{ font-size:14px; line-height:1.5; margin:4px 0 18px; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 14px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px;
  }
  .card .swatch{
    width:40px; height:40px; border-radius:9px; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; color:var(--accent);
  }
  .card .meta{ flex:1; min-width:0; }
  .card .label{ font-size:15px; font-weight:600; margin:0 0 2px; }
  .card .sub{
    font-size:12.5px; color:var(--text-dim); font-family:var(--mono);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card .chev{ color:var(--text-faint); font-size:18px; }
  .card:active{ background:var(--surface-2); }

  .fab{
    position:fixed; right:calc(18px + var(--safe-r)); bottom:calc(22px + var(--safe-b));
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#062019; border:none;
    font-size:28px; font-weight:400; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 20px rgba(69,214,168,.35); z-index:6;
  }
  .fab:active{ transform:scale(.94); }

  /* Form */
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:7px; font-weight:600;
  }
  .field input{
    width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:11px; padding:13px 14px; color:var(--text); font-size:16px;
    font-family:var(--mono);
  }
  .field input:focus{ outline:none; border-color:var(--accent); }
  .pwrow{ position:relative; }
  .pwrow input{ padding-right:56px; }
  .pwtoggle{
    position:absolute; right:6px; top:6px; bottom:6px; width:44px;
    background:none; border:none; color:var(--text-dim); font-size:13px; font-weight:600;
  }
  .hint{ font-size:11.5px; color:var(--text-faint); margin-top:6px; line-height:1.4; }

  .btnrow{ display:flex; gap:10px; margin-top:24px; }
  .btn{
    flex:1; padding:15px; border-radius:12px; border:1px solid var(--border);
    font-size:15px; font-weight:600; background:var(--surface); color:var(--text);
  }
  .btn:active{ background:var(--surface-2); }
  .btn.primary{ background:var(--accent); color:#062019; border-color:var(--accent); }
  .btn.primary:active{ opacity:.85; }
  .btn.danger{ background:var(--danger-dim); color:var(--danger); border-color:transparent; }

  /* Detail */
  .detailhead{ text-align:center; margin-bottom:18px; }
  .detailhead h2{ font-size:19px; margin:0 0 4px; font-weight:700; }
  .detailhead .u{ font-size:13px; color:var(--text-dim); font-family:var(--mono); }

  .segwrap{ display:flex; justify-content:center; margin-bottom:16px; }
  .seg{
    display:inline-flex; background:var(--surface); border:1px solid var(--border);
    border-radius:11px; padding:3px; gap:3px;
  }
  .segbtn{
    border:none; background:none; color:var(--text-dim); font-size:13.5px; font-weight:600;
    padding:9px 18px; border-radius:8px;
  }
  .segbtn.active{ background:var(--accent); color:#062019; }

  .qrcard{
    background:#fff; border-radius:18px; padding:22px;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px; max-width:360px;
  }
  .qrcard canvas{ display:block; width:100%; height:auto; }

  .rawbox{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:16px; font-family:var(--mono); font-size:13px;
    color:var(--text-dim); word-break:break-all; display:flex; gap:10px; align-items:center;
  }
  .rawbox .txt{ flex:1; }
  .rawbox.masked .txt{ letter-spacing:2px; }
  .rawbox button{ background:none; border:none; color:var(--accent); font-size:12px; font-weight:700; flex-shrink:0; }

  .actionsgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }

  footer.bottombar{
    padding:14px 16px calc(14px + var(--safe-b));
    border-top:1px solid var(--border); display:flex; gap:10px;
  }

  .toast{
    position:fixed; left:50%; bottom:calc(90px + var(--safe-b)); transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:30px; font-size:13px; z-index:20;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  /* custom confirm modal — window.confirm() is blocked inside sandboxed
     preview iframes (e.g. Claude's file preview), so we don't rely on it */
  .modalback{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center; z-index:30;
    padding:24px;
  }
  .modalcard{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px; max-width:320px; width:100%;
  }
  .modalcard p{ font-size:14.5px; line-height:1.5; margin:0 0 18px; color:var(--text); }
  .modalcard .btnrow{ margin-top:0; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

  <div class="topbar">
    <div>
      <p class="eyebrow" id="crumbEyebrow">Login QR Cards</p>
      <h1 id="crumbTitle">Saved cards</h1>
    </div>
    <button class="iconbtn hidden" id="backBtn">←</button>
  </div>

  <main id="main"></main>

  <button class="fab" id="fabAdd">+</button>
  <div class="toast" id="toast"></div>

        }

  var crumbTitle = document.getElementById("crumbTitle");
  var crumbEyebrow = document.getElementById("crumbEyebrow");
  var toastEl = document.getElementById("toast");

  var view = "list";     // list | form | detail
  var editingId = null;  // id being edited, or null for new
  var activeId = null;   // id being viewed in detail

  /* ---------- storage (light obfuscation, NOT real encryption) ---------- */
  function b64encode(str){
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64decode(str){
    try{ return decodeURIComponent(escape(atob(str))); }catch(e){ return ""; }
  }
  function loadEntries(){
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    try{
      var decoded = b64decode(raw);
      var arr = JSON.parse(decoded);
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveEntries(arr){
    localStorage.setItem(STORAGE_KEY, b64encode(JSON.stringify(arr)));
  }
  var entries = loadEntries();

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  /* ---------- custom confirm (native confirm() is blocked in sandboxed iframes) ---------- */
  function showConfirm(message, onYes){
    var back = document.createElement("div");
    back.className = "modalback";
    back.innerHTML =
      '<div class="modalcard"><p>'+message+'</p>' +
      '<div class="btnrow"><button class="btn" id="mCancel">Cancel</button>' +
      '<button class="btn danger" id="mYes">Delete</button></div></div>';
    document.body.appendChild(back);
    function close(){ back.remove(); }
    back.addEventListener("click", function(ev){ if(ev.target === back) close(); });
    back.querySelector("#mCancel").addEventListener("click", close);
    back.querySelector("#mYes").addEventListener("click", function(){ close(); onYes(); });
  }

  /* ---------- QR payload ---------- */
  // Format sent to the scanner: username, then a TAB, then password.
  // Most HID/USB/BLE barcode & QR scanners emit this as literal keystrokes,
  // which lands "username" in a focused username field, TAB moves focus to
  // the password field, and password is then typed in. Adjust below if your
  // scanner/login form expects a different layout (e.g. newline-separated).
  function payloadFor(entry){
    return entry.username + "\t" + entry.password;
  }

  function drawQR(canvas, text){
    var qr = qrcode(0, "M"); // type 0 = auto-detect smallest size; M = ~15% error correction
    qr.addData(text);
    qr.make();
    var count = qr.getModuleCount();
    var margin = 4; // quiet zone, in modules — required for reliable scanning
    var cell = Math.floor(560 / (count + margin * 2)) || 1;
    var size = (count + margin * 2) * cell;
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#000000";
    for(var r=0; r<count; r++){
      for(var c=0; c<count; c++){
        if(qr.isDark(r,c)){
          ctx.fillRect((c+margin)*cell, (r+margin)*cell, cell, cell);
        }
      }
    }
    return canvas;
  }

  function drawBarcode(canvas, text){
    // CODE128, auto subtype-switching (handles the tab character in our payload)
    JsBarcode(canvas, text, {
      format: "CODE128",
      width: 2.4,
      height: 140,
      margin: 16,
      displayValue: false,   // don't print the plaintext under the code
      background: "#ffffff",
      lineColor: "#000000"
    });
    return canvas;
  }

  function drawCode(canvas, text, type){
    return type === "barcode" ? drawBarcode(canvas, text) : drawQR(canvas, text);
  }

  /* ---------- routing ---------- */
  function go(next, opts){
    opts = opts || {};
    view = next;
    if(next === "list"){
      backBtn.classList.add("hidden");
      crumbEyebrow.textContent = "Login QR Cards";
      crumbTitle.textContent = "Saved cards";
      fabAdd.classList.remove("hidden");
    } else if(next === "form"){
      backBtn.classList.remove("hidden");
      crumbEyebrow.textContent = "Login QR Cards";
      crumbTitle.textContent = opts.editing ? "Edit card" : "New card";
      fabAdd.classList.add("hidden");
    } else if(next === "detail"){
      backBtn.classList.remove("hidden");
      crumbEyebrow.textContent = "Scan-ready";
      crumbTitle.textContent = "QR card";
      fabAdd.classList.add("hidden");
    }
    render();
  }

  backBtn.addEventListener("click", function(){
    if(view === "detail"){ go("list"); }
    else if(view === "form"){ go(editingId ? "detail" : "list"); if(!editingId){ /* stay list */ } }
  });
  fabAdd.addEventListener("click", function(){ editingId = null; go("form", {editing:false}); });

  /* ---------- render ---------- */
  function render(){
    if(view === "list") return renderList();
    if(view === "form") return renderForm();
    if(view === "detail") return renderDetail();
  }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
  }

  function renderList(){
    var noticeDismissed = localStorage.getItem(NOTICE_KEY) === "1";
    var html = "";
    if(!noticeDismissed){
      html += '<div class="notice" id="noticeBox">' +
        '<span>🔒 Cards are stored only on <b>this device</b>, in this browser. Storage is lightly obfuscated, not strongly encrypted — keep your phone locked, and use <b>Export backup</b> if you need a copy elsewhere.</span>' +
        '<button id="noticeClose">✕</button></div>';
    }
    if(entries.length === 0){
      html += '<div class="empty"><div class="glyph">▦</div>' +
        '<p>No saved cards yet.<br>Add a username &amp; password to generate a scannable QR login card.</p>' +
        '<button class="btn primary" id="emptyAddBtn" style="max-width:220px;margin:0 auto 14px;display:block;">+ New card</button>' +
        '<button class="btn" id="importBtn" style="max-width:220px;margin:0 auto;display:block;">Import backup</button></div>';
    } else {
      entries.forEach(function(e){
        html += '<div class="card" data-id="'+e.id+'">' +
          '<div class="swatch">'+esc((e.label||"?").trim().charAt(0).toUpperCase() || "?")+'</div>' +
          '<div class="meta"><p class="label">'+esc(e.label||"Untitled")+'</p>' +
          '<p class="sub">'+esc(e.username)+'</p></div>' +
          '<div class="chev">›</div></div>';
      });
      html += '<div class="btnrow" style="margin-top:22px;">' +
        '<button class="btn" id="exportBtn">Export backup</button>' +
        '<button class="btn" id="importBtn">Import backup</button></div>';
    }
    html += '<input type="file" id="importFile" accept="application/json" class="hidden">';
    html += '<p style="text-align:center;color:var(--text-faint);font-size:11px;margin-top:22px;">Login QR Cards — v4</p>';
    main.innerHTML = html;

    var nc = document.getElementById("noticeClose");
    if(nc) nc.addEventListener("click", function(){
      localStorage.setItem(NOTICE_KEY, "1");
      document.getElementById("noticeBox").remove();
    });
    var eab = document.getElementById("emptyAddBtn");
    if(eab) eab.addEventListener("click", function(){ editingId=null; go("form",{editing:false}); });

    Array.prototype.forEach.call(main.querySelectorAll(".card"), function(card){
      card.addEventListener("click", function(){
        activeId = card.getAttribute("data-id");
        go("detail");
      });
    });

    var exportBtn = document.getElementById("exportBtn");
    if(exportBtn) exportBtn.addEventListener("click", exportBackup);
    var importBtn = document.getElementById("importBtn");
    var importFile = document.getElementById("importFile");
    if(importBtn) importBtn.addEventListener("click", function(){ importFile.click(); });
    if(importFile) importFile.addEventListener("change", importBackup);
  }

  function renderForm(){
    var e = editingId ? entries.find(function(x){return x.id===editingId;}) : null;
    var html =
      '<div class="field"><label>Label</label>' +
      '<input type="text" id="fLabel" placeholder="e.g. CCLAS floor terminal" value="'+esc(e?e.label:"")+'" autocapitalize="words"></div>' +
      '<div class="field"><label>Username</label>' +
      '<input type="text" id="fUser" placeholder="username" value="'+esc(e?e.username:"")+'" autocapitalize="none" autocorrect="off" spellcheck="false"></div>' +
      '<div class="field"><label>Password</label>' +
      '<div class="pwrow"><input type="password" id="fPass" placeholder="password" value="'+esc(e?e.password:"")+'" autocapitalize="none" autocorrect="off" spellcheck="false">' +
      '<button type="button" class="pwtoggle" id="fPassToggle">Show</button></div>' +
      '<p class="hint">Encoded as username, then a tab, then password — the layout most barcode/QR scanners use to auto-fill a login form. You can switch between QR code and barcode output after saving.</p></div>' +
      '<div class="btnrow">' +
      (e ? '<button class="btn danger" id="fDelete">Delete</button>' : '') +
      '<button class="btn primary" id="fSave">Save</button></div>';
    main.innerHTML = html;

    var passInput = document.getElementById("fPass");
    document.getElementById("fPassToggle").addEventListener("click", function(){
      var showing = passInput.type === "text";
      passInput.type = showing ? "password" : "text";
      this.textContent = showing ? "Show" : "Hide";
    });

    document.getElementById("fSave").addEventListener("click", function(){
      var label = document.getElementById("fLabel").value.trim();
      var user = document.getElementById("fUser").value.trim();
      var pass = document.getElementById("fPass").value;
      if(!user || !pass){ toast("Username and password are required"); return; }
      if(!label) label = user;
      if(e){
        e.label = label; e.username = user; e.password = pass;
      } else {
        e = {id: uid(), label: label, username: user, password: pass, created: Date.now(), codeType: "qr"};
        entries.unshift(e);
      }
      saveEntries(entries);
      activeId = e.id;
      toast("Saved");
      go("detail");
    });

    var delBtn = document.getElementById("fDelete");
    if(delBtn) delBtn.addEventListener("click", function(){
      showConfirm("Delete this card? This can't be undone.", function(){
        entries = entries.filter(function(x){return x.id!==e.id;});
        saveEntries(entries);
        go("list");
      });
    });
  }

  function renderDetail(){
    var e = entries.find(function(x){return x.id===activeId;});
    if(!e){ go("list"); return; }
    if(!e.codeType) e.codeType = "qr";
    main.innerHTML =
      '<div class="detailhead"><h2>'+esc(e.label)+'</h2><div class="u">'+esc(e.username)+'</div></div>' +
      '<div class="segwrap"><div class="seg">' +
      '<button class="segbtn'+(e.codeType==="qr"?" active":"")+'" data-type="qr">QR code</button>' +
      '<button class="segbtn'+(e.codeType==="barcode"?" active":"")+'" data-type="barcode">Barcode</button>' +
      '</div></div>' +
      '<div class="qrcard"><canvas id="qrCanvas"></canvas></div>' +
      '<div class="rawbox masked" id="rawBox"><span class="txt" id="rawTxt">••••••••••••••••••</span>' +
      '<button id="rawToggle">Show</button></div>' +
      '<div class="actionsgrid">' +
      '<button class="btn primary" id="saveImgBtn">Save / Share image</button>' +
      '<button class="btn" id="copyBtn">Copy text</button>' +
      '</div>' +
      '<div class="btnrow">' +
      '<button class="btn" id="editBtn">Edit</button>' +
      '<button class="btn danger" id="delBtn">Delete</button></div>';

    var canvas = document.getElementById("qrCanvas");
    drawCode(canvas, payloadFor(e), e.codeType);

    Array.prototype.forEach.call(main.querySelectorAll(".segbtn"), function(btn){
      btn.addEventListener("click", function(){
        var type = btn.getAttribute("data-type");
        if(e.codeType === type) return;
        e.codeType = type;
        saveEntries(entries);
        Array.prototype.forEach.call(main.querySelectorAll(".segbtn"), function(b){
          b.classList.toggle("active", b.getAttribute("data-type") === type);
        });
        drawCode(canvas, payloadFor(e), e.codeType);
      });
    });

    var raw = payloadFor(e).replace("\t"," → ");
    var rawShown = false;
    document.getElementById("rawToggle").addEventListener("click", function(){
      rawShown = !rawShown;
      document.getElementById("rawTxt").textContent = rawShown ? raw : "••••••••••••••••••";
      document.getElementById("rawBox").classList.toggle("masked", !rawShown);
      this.textContent = rawShown ? "Hide" : "Show";
    });

    document.getElementById("copyBtn").addEventListener("click", function(){
      var text = payloadFor(e);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast("Copied to clipboard"); })
          .catch(function(){ toast("Couldn't copy"); });
      } else {
        toast("Clipboard not available");
      }
    });

    document.getElementById("saveImgBtn").addEventListener("click", function(){
      canvas.toBlob(function(blob){
        if(!blob){ toast("Couldn't create image"); return; }
        var fileName = (e.label || "login-qr").replace(/[^a-z0-9\-_]+/gi,"_") + ".png";
        var file = new File([blob], fileName, {type:"image/png"});
        if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title: e.label}).catch(function(){});
        } else {
          var url = URL.createObjectURL(blob);
          var w = window.open(url, "_blank");
          if(!w){ toast("Long-press the QR above to save it"); }
          setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
        }
      }, "image/png");
    });

    document.getElementById("editBtn").addEventListener("click", function(){
      editingId = e.id; go("form", {editing:true});
    });
    document.getElementById("delBtn").addEventListener("click", function(){
      showConfirm("Delete this card? This can't be undone.", function(){
        entries = entries.filter(function(x){return x.id!==e.id;});
        saveEntries(entries);
        go("list");
      });
    });
  }

  /* ---------- backup export / import ---------- */
  function exportBackup(){
    var blob = new Blob([JSON.stringify({exported: Date.now(), entries: entries}, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "login-qr-cards-backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    toast("Backup file created — plaintext, store it safely");
  }
  function importBackup(ev){
    var file = ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var incoming = Array.isArray(data) ? data : (data.entries || []);
        if(!Array.isArray(incoming)) throw new Error("bad format");
        incoming.forEach(function(item){
          if(item && item.username && item.password){
            entries.unshift({
              id: uid(),
              label: item.label || item.username,
              username: item.username,
              password: item.password,
              created: Date.now(),
              codeType: (item.codeType === "barcode") ? "barcode" : "qr"
            });
          }
        });
        saveEntries(entries);
        toast("Imported " + incoming.length + " card(s)");
        go("list");
      }catch(err){
        toast("That file couldn't be read");
      }
    };
    reader.readAsText(file);
    ev.target.value = "";
  }

  /* ---------- boot ---------- */
  go("list");
})();
</script>
</body>
</html>
